{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<h2 class="mb-4">{% if user_data %}Edit{% else %}Create{% endif %} User</h2>
    
<form method="post">
    {% csrf_token %}
    
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">
        {% if user_data %}Update{% else %}Create{% endif %} User
    </button>
</form>
    <br>
    <a href="{% url 'user_list' %}">Back to User List</a>
{% endblock %}
