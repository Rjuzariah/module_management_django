{% extends 'base.html' %}
{% block content %}
    <h1>Confirm Delete</h1>
    <p>Are you sure you want to delete "{{ user_data.username }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-warning">Yes, delete</button>
        <a href="{% url 'user_list' %}" class="btn btn-light">Cancel</a>
    </form>
    
{% endblock %}
