{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Product</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button> 
        <a class="btn btn-light" href="{% url 'product_list' %}">Cancel</a>
    </form>
    
{% endblock %}
